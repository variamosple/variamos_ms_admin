name: Mutation Testing (Stryker)

on:
  workflow_dispatch:
    inputs:
      partition:
        description: 'Which part of the codebase to run mutation tests on'
        required: true
        default: 'domain'
        type: choice
        options:
          - domain
          - entrypoints
          - all
  schedule:
    # Every day at 04:00 UTC (GitHub Actions cron expressions are always UTC).
    - cron: '0 4 * * *'

permissions:
  statuses: write
  contents: read

jobs:
  stryker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: |
          npm ci

      # Stryker's exit code is never swallowed. continue-on-error lets the
      # publish step below run for every partition; the publish step fails the
      # job when a run failed or its score is under the break threshold.
      - name: Run Stryker (Domain)
        id: stryker_domain
        if: ${{ github.event_name == 'schedule' || inputs.partition == 'domain' || inputs.partition == 'all' }}
        continue-on-error: true
        run: |
          npx stryker run stryker.domain.config.json --reporters progress,clear-text,html,json

      - name: Keep Domain mutation report
        if: ${{ always() && steps.stryker_domain.outcome != 'skipped' }}
        run: |
          if [ -f reports/mutation/mutation.json ]; then
            mv reports/mutation/mutation.json reports/mutation/domain.json
          fi

      - name: Run Stryker (EntryPoints)
        id: stryker_entrypoints
        if: ${{ inputs.partition == 'entrypoints' || inputs.partition == 'all' }}
        continue-on-error: true
        run: |
          npx stryker run stryker.entrypoints.config.json --reporters progress,clear-text,html,json

      - name: Keep EntryPoints mutation report
        if: ${{ always() && steps.stryker_entrypoints.outcome != 'skipped' }}
        run: |
          if [ -f reports/mutation/mutation.json ]; then
            mv reports/mutation/mutation.json reports/mutation/entrypoints.json
          fi

      - name: Publish scores and fail under threshold
        if: ${{ always() }}
        uses: actions/github-script@v9
        env:
          DOMAIN_OUTCOME: ${{ steps.stryker_domain.outcome }}
          ENTRYPOINTS_OUTCOME: ${{ steps.stryker_entrypoints.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const workspace = process.env.GITHUB_WORKSPACE;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const partitions = [
              { name: 'domain', config: 'stryker.domain.config.json', outcome: process.env.DOMAIN_OUTCOME },
              { name: 'entrypoints', config: 'stryker.entrypoints.config.json', outcome: process.env.ENTRYPOINTS_OUTCOME },
            ];

            const summary = ['### Stryker Mutation Testing Summary', ''];
            let jobFailed = false;

            for (const p of partitions) {
              if (p.outcome === 'skipped' || !p.outcome) continue;

              // Break threshold is read from the Stryker config, not hard-coded.
              const config = JSON.parse(fs.readFileSync(path.join(workspace, p.config), 'utf8'));
              const threshold = config.thresholds.break;

              // Score = (killed + timeout) / (killed + timeout + survived + noCoverage).
              // CompileError and Ignored mutants are excluded, as in Stryker's own metrics.
              const reportPath = path.join(workspace, 'reports/mutation', `${p.name}.json`);
              let score = null;
              const counts = {};
              if (fs.existsSync(reportPath)) {
                const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
                for (const file of Object.values(report.files)) {
                  for (const mutant of file.mutants) {
                    counts[mutant.status] = (counts[mutant.status] || 0) + 1;
                  }
                }
                const detected = (counts.Killed || 0) + (counts.Timeout || 0);
                const undetected = (counts.Survived || 0) + (counts.NoCoverage || 0);
                score = detected + undetected > 0 ? (detected / (detected + undetected)) * 100 : null;
              }

              const passed = p.outcome === 'success' && score !== null && score >= threshold;
              const state = passed ? 'success' : 'failure';
              const scoreText = score === null ? 'no valid mutant or report missing' : `${score.toFixed(2)}%`;
              const description = `${scoreText} (break ${threshold}%) - ${passed ? 'pass' : 'fail'}`.slice(0, 140);

              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: state,
                context: `Stryker / Mutation Score (${p.name})`,
                description: description,
                target_url: runUrl,
              });

              summary.push(`#### ${p.name}`);
              summary.push(`- **Mutation score:** ${scoreText}`);
              summary.push(`- **Break threshold:** ${threshold}%`);
              summary.push(`- **Mutants:** killed ${counts.Killed || 0}, timeout ${counts.Timeout || 0}, survived ${counts.Survived || 0}, no coverage ${counts.NoCoverage || 0}, compile error ${counts.CompileError || 0}`);
              summary.push(`- **Stryker run:** ${p.outcome}`);
              summary.push(`- **Status:** ${passed ? 'Passed' : 'FAILED'}`);
              summary.push('');

              if (!passed) jobFailed = true;
            }

            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join('\n') + '\n');

            if (jobFailed) {
              core.setFailed('Stryker run failed or mutation score is under the break threshold. See the job summary.');
            }
