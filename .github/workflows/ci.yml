name: Backend CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: |
        npm ci

    - name: Verify commit message format
      if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
      run: |
        npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

    - name: Audit npm dependencies for high vulnerabilities
      run: |
        npm audit --audit-level=high

    - name: Check code formatting (Prettier)
      run: |
        npx prettier --check "src/**/*.ts"

    - name: Cache ESLint
      uses: actions/cache@v6
      with:
        path: .eslintcache
        key: ${{ runner.os }}-eslint-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-eslint-${{ hashFiles('package-lock.json') }}-
          ${{ runner.os }}-eslint-

    - name: Run linter (ESLint)
      run: |
        npm run lint -- --cache --cache-location .eslintcache

    - name: Verify TypeScript types
      run: |
        npm run typecheck

    - name: Verify Clean Architecture boundaries
      run: |
        npm run check-arch

    - name: Run unit tests
      run: |
        npm run test

    - name: Verify production build
      run: |
        npm run build

    - name: Run TruffleHog Secret Scan
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./

