name: Backend CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: |
        npm ci

    - name: Verify commit message format
      if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
      run: |
        npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

    - name: Audit npm dependencies for high vulnerabilities
      run: |
        npm audit --audit-level=high

    - name: Run linter and formatter (Biome)
      run: |
        npm run lint

    - name: Verify TypeScript types
      run: |
        npm run typecheck

    - name: Verify Clean Architecture boundaries
      run: |
        npm run check-arch

    - name: Run unit tests
      run: |
        npm run test

    - name: Verify production build
      run: |
        npm run build

    - name: Build Docker image for testing
      run: |
        docker build -t backend-test .

    - name: Run Docker container smoke test
      run: |
        docker run -d --name test-app -p 4000:4000 backend-test
        sleep 5
        if [ "$(docker inspect -f '{{.State.Running}}' test-app)" != "true" ]; then
          echo "Error: Container crashed on startup!"
          docker logs test-app
          exit 1
        fi
        docker stop test-app
        docker rm test-app

    - name: Run TruffleHog Secret Scan
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./

