name: Backend CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: |
        npm ci

    - name: Verify commit message format
      if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
      run: |
        npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

    - name: Audit npm dependencies (gated by audit-exceptions.json)
      run: |
        node scripts/audit-gate.mjs

    - name: Run linter and formatter (Biome)
      run: |
        npm run lint

    - name: Verify TypeScript types
      run: |
        npm run typecheck

    - name: Verify Clean Architecture boundaries
      run: |
        npm run check-arch

    - name: Run unit tests with the coverage thresholds
      run: |
        npm run test:coverage

    - name: Verify production build
      run: |
        npm run build

    - name: Build Docker image for testing
      run: |
        docker build -t backend-test .

    - name: Run Docker container smoke test
      run: |
        # Without its secrets, the image must refuse to start (EV-69)
        code=0; timeout 60 docker run --rm backend-test || code=$?
        if [ "$code" -ne 1 ]; then
          echo "Error: without its secrets, the container must stop with code 1 (got $code)"
          exit 1
        fi
        # With placeholder values, it must keep running (it waits for the database)
        docker run -d --name test-app -p 4000:4000 \
          -e DB_HOST=db -e DB_USER=ci -e DB_PASSWORD=ci -e DB_DATABASE=ci \
          -e NOTIFICATION_INTERNAL_TOKEN=ci -e VARIAMOS_PRIVATE_KEY_PATH=ci.key \
          backend-test
        sleep 5
        if [ "$(docker inspect -f '{{.State.Running}}' test-app)" != "true" ]; then
          echo "Error: Container crashed on startup!"
          docker logs test-app
          exit 1
        fi
        docker stop test-app
        docker rm test-app

    - name: Run TruffleHog Secret Scan
      uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
      with:
        path: ./
        # The image of the same release, not "latest": change it with the
        # SHA above when Dependabot updates the action
        version: 3.99.2

