name: Backend CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Three jobs side by side, each on its own runner, so that a run takes about
# two minutes instead of three and a half (EV-118); build-and-test, the
# required check, waits for the three.
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: 'npm'
        cache-dependency-path: package-lock.json

    # No lifecycle script of the dependencies runs (Husky is not needed here;
    # bcrypt ships its prebuilt binaries)
    - name: Install dependencies
      run: |
        npm ci --ignore-scripts

    - name: Verify commit message format
      if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
      run: |
        npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

    - name: Audit npm dependencies (gated by audit-exceptions.json)
      run: |
        node scripts/audit-gate.mjs

    - name: Run linter and formatter (Biome)
      run: |
        npm run lint

    # Spelling of code, docs, workflows, scripts and Docker files (American English)
    - name: Check spelling (cspell)
      run: |
        npm run spell

    - name: Verify TypeScript types
      run: |
        npm run typecheck

    - name: Verify Clean Architecture boundaries
      run: |
        npm run check-arch

    # Unused files, exports and dependencies: knip exits with an error on any finding
    - name: Find dead code (knip)
      run: |
        npm run find-deadcode

    - name: Verify production build
      run: |
        npm run build

    - name: Run TruffleHog Secret Scan
      uses: trufflesecurity/trufflehog@3bd2b5887eb0efb8fa18bfd1d296032924e4ffdc # v3.99.9
      with:
        path: ./
        # The image of the same release, not "latest": change it with the
        # SHA above when Dependabot updates the action
        version: 3.99.7

  # The unit tests, then SonarCloud on their coverage
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The *.integration.test.ts files run on a disposable PostgreSQL, the
    # version of production; without it, their 105 tests were skipped
    services:
      postgres:
        image: postgres:14.8
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: 'npm'
        cache-dependency-path: package-lock.json

    # No lifecycle script of the dependencies runs (Husky is not needed here;
    # bcrypt ships its prebuilt binaries)
    - name: Install dependencies
      run: |
        npm ci --ignore-scripts

    - name: Run the tests, database tests included, with the coverage thresholds
      env:
        MIGRATIONS_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
      run: |
        npm run test:coverage

    # The JRE and the plugins of the scanner, kept from run to run
    - name: Restore the SonarCloud cache
      if: github.event.pull_request.user.login != 'dependabot[bot]'
      uses: actions/cache@v6
      with:
        path: ~/.sonar/cache
        key: sonar-${{ runner.os }}-scanner

    # The organization's token is not given to Dependabot pull requests
    - name: Analyze with SonarCloud, coverage included
      if: github.event.pull_request.user.login != 'dependabot[bot]'
      uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # The image, its layers from the GitHub Actions cache (written on main,
  # read by the pull requests), then the smoke test
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build Docker image for testing
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        load: true
        tags: backend-test
        cache-from: type=gha,scope=backend-test
        cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=backend-test,mode=max,ignore-error=true' || '' }}

    # The check of the publish workflow, before the merge (lot Q1)
    - name: Check the image (Trivy, environment files and keys)
      run: |
        bash scripts/scan-image.sh backend-test

    - name: Run Docker container smoke test
      run: |
        # Without its secrets, the image must refuse to start (EV-69)
        code=0; timeout 60 docker run --rm backend-test || code=$?
        if [ "$code" -ne 1 ]; then
          echo "Error: without its secrets, the container must stop with code 1 (got $code)"
          exit 1
        fi
        # With a key path but no key, it must refuse to start: no session
        # could be opened (ADM-N01)
        code=0; timeout 60 docker run --rm \
          -e DB_HOST=db -e DB_USER=ci -e DB_PASSWORD=ci -e DB_DATABASE=ci \
          -e NOTIFICATION_INTERNAL_TOKEN=ci -e VARIAMOS_PRIVATE_KEY_PATH=missing.key \
          -e CORS_ALLOWED_ORIGINS=https://ci.example \
          backend-test || code=$?
        if [ "$code" -ne 1 ]; then
          echo "Error: without a signing key, the container must stop with code 1 (got $code)"
          exit 1
        fi
        # With placeholder values and a throwaway key, it must keep running
        # (it waits for the database)
        key_dir=$(mktemp -d)
        openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$key_dir/ci.key"
        chmod 644 "$key_dir/ci.key"   # read by the non-root user of the image
        docker run -d --name test-app -p 4000:4000 \
          -v "$key_dir/ci.key:/keys/ci.key:ro" \
          -e DB_HOST=db -e DB_USER=ci -e DB_PASSWORD=ci -e DB_DATABASE=ci \
          -e NOTIFICATION_INTERNAL_TOKEN=ci -e VARIAMOS_PRIVATE_KEY_PATH=/keys/ci.key \
          -e CORS_ALLOWED_ORIGINS=https://ci.example \
          backend-test
        sleep 5
        if [ "$(docker inspect -f '{{.State.Running}}' test-app)" != "true" ]; then
          echo "Error: Container crashed on startup!"
          docker logs test-app
          exit 1
        fi
        docker stop test-app
        docker rm test-app

  # The required check: it passes only when the three jobs pass (a skipped
  # required check would count as passed). Its name stays the one the
  # protection of main asks for.
  build-and-test:
    needs: [checks, coverage, docker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Require the checks, the tests and the image
      run: |
        test "${{ needs.checks.result }}" = success
        test "${{ needs.coverage.result }}" = success
        test "${{ needs.docker.result }}" = success
