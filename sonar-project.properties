# SonarCloud analysis run by the CI (build-and-test), with the coverage of
# Vitest; automatic analysis is off. Files are listed one by one: the env/
# files and the keys are never sent.
sonar.organization=variamosple-1
sonar.projectKey=variamosple_variamos_ms_admin

sonar.sources=src,scripts,load-tests,build.ts,Dockerfile,.github
sonar.tests=src
sonar.exclusions=src/**/*.test.ts,src/**/*.spec.ts,src/**/fixtures/**
sonar.test.inclusions=src/**/*.test.ts,src/**/*.spec.ts

# The coverage measured by Vitest (vitest.config.ts): Domain and EntryPoints.
# The repositories and the database code are tested on PostgreSQL, which the
# CI does not start; outside that perimeter a file is not "uncovered".
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/common/**,src/DataProviders/**,src/Infrastructure/**,src/*.ts,src/EntryPoints/index.ts,scripts/**,load-tests/**,build.ts
